# Canonical Atto CLI parser schema. `flags2env` is the only option parser.
# SECURITY: runtime authority is derived ONLY from parsed.provided_flags
# (argv provenance), never the parser's ambient/default-resolved map.
[identity]
service = "atto"
type_name = "AttoCliFlags"

[parse]
require_equals = true
allow_unknown = false

[env]
load = false
files = []

[commands.run]
[commands.build]
[commands.check]
[commands.test]
[commands.lsp]
[commands.doctor]
[commands.version]

[flags.backend]
env = "ATTO_BACKEND"
aliases = ["backend"]
type = "string"

[flags.runner]
env = "ATTO_RUNNER"
aliases = ["runner"]
type = "string"

[flags.sha256]
env = "ATTO_SHA256"
aliases = ["sha256"]
type = "string"

[flags.timeout_ms]
env = "ATTO_TIMEOUT_MS"
aliases = ["timeout-ms"]
type = "string"

[flags.single_threaded]
env = "ATTO_SINGLE_THREADED"
aliases = ["single-threaded"]
type = "bool"

[flags.max_threads_per_space]
env = "ATTO_MAX_THREADS_PER_SPACE"
aliases = ["max-threads-per-space"]
type = "string"

[flags.mode]
