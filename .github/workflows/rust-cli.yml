name: Rust Atto CLI single-threaded policy (source-free)
on:
  pull_request:
    paths:
      - Cargo.toml
      - src/**
      - .github/workflows/rust-cli.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - src/**
      - .github/workflows/rust-cli.yml
permissions:
  contents: read
jobs:
  host-only-cli-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Test Rust policy and host invocation (not guest execution)
        run: cargo test --offline --all-targets
