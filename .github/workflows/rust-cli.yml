name: Rust Atto CLI flags2env and guest admission (host-only)
on:
  pull_request:
    paths:
      - Cargo.toml
      - .cli-flags.toml
      - src/**
      - tests/**
      - .github/workflows/rust-cli.yml
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - .cli-flags.toml
      - src/**
      - tests/**
      - .github/workflows/rust-cli.yml
permissions:
  contents: read
jobs:
  host-only-cli-contract:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source commit
        shell: bash
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
      - name: Test pinned flags2env CLI and policy requests (NOT guest execution)
        run: |
          cargo test --all-targets
          cargo test --all-targets permissions
      - name: State guest-security evidence limit
        shell: bash
        run: |
          echo "HOST_ONLY: no compiled Atto source, filesystem broker, or tenant isolation demonstrated."
          echo "Do NOT mark host FS/network permissions implemented from this workflow."
